[project]
name = "up-mate-backend"
version = "0.1.0"
description = "The backend server to keep your mate up to date"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = "MIT"
requires-python = ">=3.9,<4"
dependencies = [
    "flask (>=3.1.2,<4.0.0)", 
    "requests (>=2.32.5,<3.0.0)",
    "pymongo (>=4.15.4,<5.0.0)",
    "python-decouple (>=3.8,<4.0)"
]

[tool.poetry.dependencies]

[tool.poetry.scripts]
up-mate-server = "up_mate_backend.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
