<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Up-Mate - {{ title }}</title>
    
    <style>
        @keyframes spin {
            0% {transform: rotate(0deg);}
            100% {transform: rotate(360deg);}
        }
        .spinning-icon {
            animation: spin 2s linear infinite;
            display: inline-block;
        }

        html, body {
            font-family: sans-serif;
            font-size: 18pt;

            /* background-color: #302f2f; */
        }

        h1, h2, h3 { color: #7680d4;}
        p, span, body { color: #c0bfc7}

        datalist {
            display: flex;
            justify-content: space-between;
            color: #c0bfc7;
            margin-right: -.5em;
        }

        option {
            padding: 0;
        }
    </style>

    <script src="/static/jquery-3.7.1.min.js"></script>
    <script src="/static/bootstrap-4.4.1-dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/static/bootstrap-4.4.1-dist/css/bootstrap.min.css"></link>

    {% block head %}
    {% endblock %}
</head>
<body class="container bg-dark" style="width: 100%; width: 100vw;">
    <div class="col-md-6 mx-auto">
        <h1>Up-Mate - {{ title }}</h1>
   
        {% block body %}
        This is default content
        {% endblock %}
    </div>
</body>
</html>
